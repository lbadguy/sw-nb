<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta id="themeColorMeta" name="theme-color" content="#e9ebee">
  <script>
    (function () {
      var theme = 'light';
      try {
        var stored = window.localStorage.getItem('swnb_theme');
        theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (error) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
      document.getElementById('themeColorMeta').setAttribute('content', theme === 'dark' ? '#0d1014' : '#e9ebee');
    }());
  </script>
  <title>我要娶一个旅行车 | 全部动态</title>
  <meta name="description" content="同步展示我要娶一个旅行车在懂车帝公开发布的全部动态，每日更新一次。">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="我要娶一个旅行车 | 全部动态">
  <meta property="og:description" content="公开动态的个人化归档，每日同步。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="profile-topbar liquid-glass">
    <a class="profile-brand" href="../" aria-label="返回 SW-nb 首页">
      <span class="profile-brand-mark" aria-hidden="true">SW</span>
      <span>SW-nb</span>
    </a>

    <nav class="profile-nav" aria-label="页面导航">
      <a class="profile-nav-link" href="../">首页</a>
      <a id="topSourceLink" class="profile-nav-link" href="https://www.dongchedi.com/user/485359118462679"
        target="_blank" rel="noopener noreferrer">懂车帝原页</a>
      <button id="themeToggleBtn" class="theme-toggle" type="button" aria-pressed="false" title="切换主题">
        <span class="theme-symbol" aria-hidden="true">◐</span>
        <span class="theme-label">深色</span>
      </button>
    </nav>
  </header>

  <main class="profile-shell">
    <section class="profile-hero liquid-glass motion-reveal" aria-labelledby="profileName">
      <div class="profile-cover" aria-hidden="true">
        <img id="profileCover" alt="" decoding="async" referrerpolicy="no-referrer">
        <div class="profile-cover-shade"></div>
      </div>

      <div class="profile-identity">
        <div class="profile-avatar-wrap">
          <img id="profileAvatar" class="profile-avatar" alt="我要娶一个旅行车的头像" width="116" height="116"
            decoding="async" referrerpolicy="no-referrer">
        </div>
        <div class="profile-copy">
          <p class="profile-eyebrow">PERSONAL ARCHIVE</p>
          <h1 id="profileName">我要娶一个旅行车</h1>
          <p id="profileBio" class="profile-bio">正在读取公开资料。</p>
          <div id="profileMedals" class="profile-medals" aria-label="账号徽章"></div>
          <div class="profile-sync-row">
            <span id="syncStatus" class="sync-status" aria-live="polite">正在连接真实数据</span>
            <span id="syncTime" class="sync-time"></span>
          </div>
        </div>
      </div>

      <dl class="profile-stats" aria-label="账号数据">
        <div>
          <dt>粉丝</dt>
          <dd id="followersCount">-</dd>
        </div>
        <div>
          <dt>关注</dt>
          <dd id="followingCount">-</dd>
        </div>
        <div>
          <dt>获赞</dt>
          <dd id="likesCount">-</dd>
        </div>
        <div>
          <dt>已同步</dt>
          <dd id="postCount">-</dd>
        </div>
      </dl>
    </section>

    <section class="archive-section motion-reveal" aria-labelledby="archiveTitle">
      <div class="archive-heading">
        <h2 id="archiveTitle">全部动态</h2>
        <p id="archiveSummary">公开内容每日同步一次，点击任意动态可查看完整图文。</p>
      </div>

      <div class="archive-tools liquid-glass">
        <label class="search-field" for="postSearch">
          <span class="sr-only">搜索动态</span>
          <input id="postSearch" type="search" autocomplete="off" placeholder="搜索标题、正文或车友圈">
        </label>
        <button id="clearSearchBtn" class="button-quiet clear-search" type="button" hidden>清除</button>
      </div>
    </section>

    <section id="feedStatus" class="feed-status" aria-live="polite">
      <div class="feed-skeleton" aria-label="正在加载动态">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>

    <section id="feedList" class="feed-grid" aria-label="公开动态列表"></section>

    <div id="loadMoreWrap" class="load-more-wrap" hidden>
      <button id="loadMoreBtn" class="button-quiet" type="button">继续看</button>
    </div>
  </main>

  <footer class="profile-footer">
    <p>内容来自懂车帝公开个人页。本页每日同步，不代表懂车帝官方。</p>
    <a href="../">回到 SW-nb</a>
  </footer>

  <dialog id="articleModal" class="post-dialog" aria-labelledby="dialogTitle">
    <div class="post-dialog-shell liquid-glass">
      <header class="post-dialog-header">
        <div>
          <span id="dialogDate" class="post-dialog-date"></span>
          <h2 id="dialogTitle">动态详情</h2>
        </div>
        <form method="dialog">
          <button class="dialog-close" type="submit" aria-label="关闭动态详情">关闭</button>
        </form>
      </header>
      <div id="modalBodyContent" class="post-dialog-body"></div>
    </div>
  </dialog>

  <script src="../shared-browser-utils.js"></script>
  <script src="app.js"></script>
</body>

</html>
